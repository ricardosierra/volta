name: validate

on:
  push:
  pull_request:

jobs:
  repo:
    name: Estrutura, convenções e links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate-repo
        run: ./tools/ci/validate-repo.sh
      - name: lint de docs
        run: ./tools/ci/lint_docs.sh
